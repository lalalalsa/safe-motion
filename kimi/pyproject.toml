[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-motion"
version = "1.0.0"
description = "VLA 机械臂安全执行器：UR5 全身安全检查与 fail-closed 安全过滤"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
qp = ["scipy>=1.10"]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["safe_motion"]
