[project]
name = "safe-motion-deepseek"
version = "1.0.0"
description = "VLA 机械臂安全执行器（SafeMotion）：纯软件安全过滤原型"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
