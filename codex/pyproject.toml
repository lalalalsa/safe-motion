[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-motion"
version = "0.1.0"
description = "Explainable runtime safety filter for 50-point UR5 VLA trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
safe-motion-replay = "safe_motion.replay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["safe_motion*"]
